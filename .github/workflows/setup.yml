name: Cumulative verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each triggered run verifies its own revision on independently owned storage.
# Do not cancel older pushed revisions when a newer push arrives.
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.21'
          python-version: '3.12.14'
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Host clients and pinned package manager
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client redis-tools
          cd "$RUNNER_TEMP"
          npm install --global pnpm@12.8.1
      - name: Locked environments
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Doctor regression tests
        run: uv run --locked python -m unittest discover -s tools -p 'test_*.py'
      - name: Isolated services from committed inputs
        run: uv run --locked python tools/setup_local.py
      - name: Static and runtime acceptance
        run: |
          for mode in --static --runtime; do
            if ! uv run --locked python tools/doctor.py "$mode" > "$RUNNER_TEMP/doctor-safe.log"; then
              cat "$RUNNER_TEMP/doctor-safe.log"
              awk '/ FAIL:/ {print "::error::" $0}' "$RUNNER_TEMP/doctor-safe.log"
              exit 1
            fi
            cat "$RUNNER_TEMP/doctor-safe.log"
          done
          git diff --check
      - name: Pinned browser runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/merlin-browser-binaries
        run: |
          npm ci --prefix .github/ci/browser --ignore-scripts --no-audit --no-fund
          node .github/ci/browser/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Build isolated PostgreSQL test runtime
        run: |
          docker build --iidfile "$RUNNER_TEMP/merlin-ci-image" -f .github/ci/postgres.Dockerfile .github/ci
          docker image inspect --format '{{.Id}}' "$(cat "$RUNNER_TEMP/merlin-ci-image")" > "$RUNNER_TEMP/merlin-ci-runtime-id"
      - name: All prior application cases, faults and migration verification
        env:
          MERLIN_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.github/ci/browser/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/merlin-browser-binaries
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: |
          uv run --locked python tools/run_ci.py --image "$(cat "$RUNNER_TEMP/merlin-ci-runtime-id")" --out "$RUNNER_TEMP/merlin-ci-results"
      - name: Retain only CI-owned synthetic verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cumulative-verification
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/merlin-ci-results/ci-summary.json
            ${{ runner.temp }}/merlin-ci-results/source-inputs.json
            ${{ runner.temp }}/merlin-ci-results/suite/summary.json
            ${{ runner.temp }}/merlin-ci-results/migration.json
      - name: Remove only runner-owned disposable resources
        if: always()
        run: |
          if test -f .env; then
            docker compose down --volumes --remove-orphans
          fi
