name: Cumulative verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each job verifies this workflow's exact revision on owned disposable storage.
# The final `setup` check is green only after every parallel lane and merge gate passes.
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.21'
          python-version: '3.12.14'
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Host clients and pinned package manager
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client redis-tools
          cd "$RUNNER_TEMP"
          npm install --global pnpm@12.8.1
      - name: Locked environments
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Doctor regression tests
        run: uv run --locked python -m unittest discover -s tools -p 'test_*.py'
      - name: Isolated services from committed inputs
        run: uv run --locked python tools/setup_local.py
      - name: Static and runtime acceptance
        run: |
          for mode in --static --runtime; do
            if ! uv run --locked python tools/doctor.py "$mode" > "$RUNNER_TEMP/doctor-safe.log"; then
              cat "$RUNNER_TEMP/doctor-safe.log"
              awk '/ FAIL:/ {print "::error::" $0}' "$RUNNER_TEMP/doctor-safe.log"
              exit 1
            fi
            cat "$RUNNER_TEMP/doctor-safe.log"
          done
          git diff --check
      - name: Remove only runner-owned disposable resources
        if: always()
        run: |
          if test -f .env; then
            docker compose down --volumes --remove-orphans
          fi

  database:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.21'
          python-version: '3.12.14'
          enable-cache: false
      - name: Host database clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client redis-tools
      - name: Locked Python environment
        run: uv sync --locked
      - name: Build isolated PostgreSQL test runtime
        run: |
          docker build --iidfile "$RUNNER_TEMP/merlin-ci-image" -f .github/ci/postgres.Dockerfile .github/ci
          docker image inspect --format '{{.Id}}' "$(cat "$RUNNER_TEMP/merlin-ci-image")" > "$RUNNER_TEMP/merlin-ci-runtime-id"
      - name: Cumulative database, migration, and baseline gates
        run: |
          uv run --locked python tools/run_ci.py \
            --database-component \
            --image "$(cat "$RUNNER_TEMP/merlin-ci-runtime-id")" \
            --out "$RUNNER_TEMP/database-component"
      - name: Retain database component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-component
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/database-component/ci-summary.json
            ${{ runner.temp }}/database-component/source-inputs.json
            ${{ runner.temp }}/database-component/suite/summary.json
            ${{ runner.temp }}/database-component/suite/database-isolation-controls.json
            ${{ runner.temp }}/database-component/suite/merlin-sql-effectiveness-final.json
            ${{ runner.temp }}/database-component/suite/merlin-sql-shard-0.json
            ${{ runner.temp }}/database-component/suite/merlin-sql-shard-1.json
            ${{ runner.temp }}/database-component/suite/merlin-lifecycle-effectiveness.json
            ${{ runner.temp }}/database-component/suite/migration-undo-results.json
            ${{ runner.temp }}/database-component/migration.json
  python-faults:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.21'
          python-version: '3.12.14'
          enable-cache: false
      - name: Locked Python environment
        run: uv sync --locked
      - name: Audit assigned Python cases and faults
        run: |
          uv run --locked python tools/audit_python_cases.py \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 2 \
            --require-detected \
            --out "$RUNNER_TEMP/python-fault-shard/report.json"
      - name: Retain shard outcomes, including failed experiments
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-fault-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/python-fault-shard/report.json

  # Keep the historical required-check name. A dependency failure must fail this
  # gate rather than leave its result skipped or successful.
  setup:
    if: always()
    needs: [prepare, database, python-faults]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every CI component
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          PYTHON_FAULT_RESULT: ${{ needs.python-faults.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$PYTHON_FAULT_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.21'
          python-version: '3.12.14'
          enable-cache: false
      - name: Locked validator environment
        run: uv sync --locked
      - name: Download database evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: database-component
          path: ${{ runner.temp }}/database-component
      - name: Download Python fault shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-fault-shard-*
          path: ${{ runner.temp }}/python-fault-shards
          merge-multiple: false
      - name: Merge and validate complete cumulative result
        run: |
          uv run --locked python tools/finalize_parallel_ci.py \
            --database-dir "$RUNNER_TEMP/database-component" \
            --python-shards "$RUNNER_TEMP/python-fault-shards" \
            --out-dir "$RUNNER_TEMP/database-component"
      - name: Retain complete case, fault, migration, and cleanup evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cumulative-verification
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/database-component/ci-summary.json
            ${{ runner.temp }}/database-component/source-inputs.json
            ${{ runner.temp }}/database-component/suite/summary.json
            ${{ runner.temp }}/database-component/suite/database-isolation-controls.json
            ${{ runner.temp }}/database-component/suite/merlin-python-effectiveness-final.json
            ${{ runner.temp }}/database-component/suite/merlin-sql-effectiveness-final.json
            ${{ runner.temp }}/database-component/suite/merlin-sql-shard-0.json
            ${{ runner.temp }}/database-component/suite/merlin-sql-shard-1.json
            ${{ runner.temp }}/database-component/suite/merlin-lifecycle-effectiveness.json
            ${{ runner.temp }}/database-component/suite/migration-undo-results.json
            ${{ runner.temp }}/database-component/migration.json
            ${{ runner.temp }}/python-fault-shards/**/report.json
